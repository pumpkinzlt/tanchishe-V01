<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q萌贪吃蛇 - 邮箱登录</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="theme-sky">
  <div class="page page-center">
    <div class="card login-card soft-pop email-auth-card">
      <div class="logo-snake">
        <div class="snake-head-demo">
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="blush left"></span>
          <span class="blush right"></span>
        </div>
      </div>
      <h1>Q萌贪吃蛇</h1>
      <p class="subtitle">邮箱注册 / 邮箱登录后开始游戏</p>
      <div class="field-group auth-tabs">
        <button id="tabLogin" class="cute-btn small active" type="button">邮箱登录</button>
        <button id="tabRegister" class="cute-btn small secondary" type="button">注册新用户</button>
      </div>
      <div class="field-group auth-form">
        <input id="email" class="cute-input" type="email" maxlength="80" placeholder="请输入邮箱" />
        <input id="password" class="cute-input" type="password" maxlength="40" placeholder="请输入密码" />
        <input id="nickname" class="cute-input hidden" type="text" maxlength="16" placeholder="注册昵称（可选，不填则取邮箱前缀）" />
        <button id="submitBtn" class="cute-btn primary">登录并开始</button>
      </div>
      <p id="authTips" class="tips">已有账号请直接输入邮箱和密码登录</p>
    </div>
  </div>
  <script src="js/user.js"></script>
  <script>
    (function () {
      const currentUser = SnakeUser.getCurrentUser();
      if (currentUser) {
        location.href = 'menu.html';
        return;
      }
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const nicknameInput = document.getElementById('nickname');
      const submitBtn = document.getElementById('submitBtn');
      const authTips = document.getElementById('authTips');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      let mode = 'login';

      function setMode(nextMode) {
        mode = nextMode;
        const registerMode = mode === 'register';
        nicknameInput.classList.toggle('hidden', !registerMode);
        tabLogin.classList.toggle('active', !registerMode);
        tabRegister.classList.toggle('active', registerMode);
        submitBtn.textContent = registerMode ? '注册并开始' : '登录并开始';
        authTips.textContent = registerMode ? '新用户请填写邮箱和密码，昵称可选' : '已有账号请直接输入邮箱和密码登录';
      }

      function normalizeEmail(value) {
        return (value || '').trim().toLowerCase();
      }

      function submit() {
        const email = normalizeEmail(emailInput.value);
        const password = passwordInput.value.trim();
        const nickname = nicknameInput.value.trim();
        if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
          alert('请输入正确的邮箱');
          emailInput.focus();
          return;
        }
        if (password.length < 4) {
          alert('密码至少 4 位');
          passwordInput.focus();
          return;
        }
        try {
          if (mode === 'register') {
            SnakeUser.register(email, password, nickname);
          }
          SnakeUser.login(email, password);
          location.href = 'menu.html';
        } catch (err) {
          alert(err && err.message ? err.message : '操作失败，请重试');
        }
      }

      submitBtn.addEventListener('click', submit);
      [emailInput, passwordInput, nicknameInput].forEach(function(el){
        el.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
      });
      tabLogin.addEventListener('click', function(){ setMode('login'); });
      tabRegister.addEventListener('click', function(){ setMode('register'); });
      setMode('login');
    })();
  </script>
</body>
</html>
